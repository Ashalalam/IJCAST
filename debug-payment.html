<!DOCTYPE html>
<html>
<head>
    <title>Debug Payment Request</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #fff;
        }
        button {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0b5ed7;
        }
        pre {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
        .info { color: #0af; }
    </style>
</head>
<body>
    <h1>Debug Payment Request</h1>
    <button onclick="testPayment()">Test Payment Request</button>
    <pre id="output">Click button to test...</pre>

    <script>
        async function testPayment() {
            const output = document.getElementById('output');
            output.innerHTML = '<span class="info">🔄 Testing payment request...</span>\n\n';
            
            const testData = {
                authorName: 'Test Author',
                authorEmail: 'test@example.com',
                authorPhone: '+919876543210',
                manuscriptId: 'TEST-001',
                authorType: 'indian',
                gasfMembership: '',
                amount: 2000,
                currency: 'INR',
                returnUrl: 'https://example.com/payment/success?order_id=test'
            };
            
            output.innerHTML += '<span class="info">📤 Request Data:</span>\n';
            output.innerHTML += JSON.stringify(testData, null, 2) + '\n\n';
            
            try {
                const response = await fetch('https://ccethswedisoehyxujqt.supabase.co/functions/v1/create-cashfree-order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjZXRoc3dlZGlzb2VoeXh1anF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxOTg1NTYsImV4cCI6MjEwNDc3NDU1Nn0.-Yb_4WPavixwz-3YgtH_-RD4jREQH-okCjGzv-ux830'
                    },
                    body: JSON.stringify(testData)
                });

                output.innerHTML += '<span class="info">📥 Response Status:</span> ' + response.status + ' ' + response.statusText + '\n\n';

                const responseText = await response.text();
                output.innerHTML += '<span class="info">📥 Response Body:</span>\n';
                
                try {
                    const responseJson = JSON.parse(responseText);
                    output.innerHTML += JSON.stringify(responseJson, null, 2) + '\n\n';
                    
                    if (response.ok) {
                        output.innerHTML += '<span class="success">✅ SUCCESS!</span>\n';
                    } else {
                        output.innerHTML += '<span class="error">❌ FAILED: ' + (responseJson.error || 'Unknown error') + '</span>\n';
                        if (responseJson.details) {
                            output.innerHTML += '<span class="error">Details: ' + responseJson.details + '</span>\n';
                        }
                    }
                } catch (e) {
                    output.innerHTML += responseText + '\n\n';
                    output.innerHTML += '<span class="error">❌ Failed to parse JSON response</span>\n';
                }
                
            } catch (error) {
                output.innerHTML += '<span class="error">❌ ERROR: ' + error.message + '</span>\n';
                console.error('Full error:', error);
            }
        }
    </script>
</body>
</html>
