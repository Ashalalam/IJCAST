# Edge Functions Configuration - Allow webhooks without JWT
[functions.cashfree-webhook]
verify_jwt = false

[functions.create-cashfree-order] 
verify_jwt = false

[functions.verify-payment]
verify_jwt = false

[functions.test-cashfree-auth]
verify_jwt = false

[analytics]
enabled = false