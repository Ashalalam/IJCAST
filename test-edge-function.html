<!DOCTYPE html>
<html>
<head>
    <title>Test Edge Function</title>
</head>
<body>
    <h1>Test Full Payment Flow</h1>
    <button onclick="testFunction()">Test Complete Payment Order</button>
    <pre id="result"></pre>

    <script>
        async function testFunction() {
            const result = document.getElementById('result');
            result.textContent = 'Testing Full Payment Flow...';
            
            try {
                const response = await fetch('https://ccethswedisoehyxujqt.supabase.co/functions/v1/create-cashfree-order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        authorName: 'Test Author',
                        authorEmail: 'test@example.com',
                        authorPhone: '+919876543210',
                        manuscriptId: 'TEST-001',
                        authorType: 'indian',
                        gasfMembership: '',
                        returnUrl: 'https://example.com/payment/success?order_id=test'
                    })
                });

                const data = await response.text();
                result.textContent = `Status: ${response.status}\n\nResponse:\n${data}`;
                
                if (response.ok) {
                    console.log('Success:', JSON.parse(data));
                } else {
                    console.error('Error:', response.status, data);
                }
            } catch (error) {
                result.textContent = `Error: ${error.message}`;
                console.error('Fetch error:', error);
            }
        }
    </script>
</body>
</html>
